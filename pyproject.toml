[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-execution"
version = "0.1.0"
description = "Durable execution engine - workflows that survive process crashes by replaying an append-only history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Parag Sawant" }]
keywords = ["durable-execution", "workflow", "event-sourcing", "temporal", "orchestration"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["resumerun"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
