<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="880" viewBox="0 0 1560 880" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1560" height="880" fill="#fbfcfe"/><text x="780.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">durable-execution - event-sourced replay</text><text x="780.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">Every step is appended to a durable log, so after a crash the workflow replays - and a completed step is served from history, never re-run.</text><rect x="50" y="150" width="1460" height="430" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">REPLAY LOOP - REPEATS UNTIL THE WORKFLOW RETURNS</text><rect x="90" y="200" width="430" height="150" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(106,215) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="136" y="231" font-size="16.5" font-weight="700" fill="#136b74">Load durable history</text><text x="107" y="253.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">store.load(wid)</text><text x="107" y="270.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the events already recorded,</text><text x="107" y="288.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">everything committed so far</text><rect x="700" y="200" width="430" height="150" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(716,215) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 6-6h8"/><path d="M15 1l3 3-3 3"/><path d="M20 14a6 6 0 0 1-6 6H6"/><path d="M9 23l-3-3 3-3"/></g><text x="746" y="231" font-size="16.5" font-weight="700" fill="#17509f">Replay from the top</text><text x="717" y="253.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">re-run the workflow fn</text><text x="717" y="270.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">recorded steps served from log</text><text x="717" y="288.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">their fn is NOT called again</text><rect x="700" y="395" width="430" height="150" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(716,410) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/></g><text x="746" y="426" font-size="16.5" font-weight="700" fill="#8c5a0d">Run the step once</text><text x="717" y="448.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">first step not yet in history</text><text x="717" y="465.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">result = fn() - the one live</text><text x="717" y="483.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">side effect of this pass</text><rect x="90" y="395" width="430" height="150" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(106,410) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></g><text x="136" y="426" font-size="16.5" font-weight="700" fill="#9e2b36">Append + persist</text><text x="107" y="448.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">append HistoryEvent, then save</text><text x="107" y="465.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">durable BEFORE the next step,</text><text x="107" y="483.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">then raise _Replay to unwind</text><rect x="1230" y="200" width="260" height="150" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1348.0,214) scale(1.0000)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></g><text x="1360.0" y="258" text-anchor="middle" font-size="16.5" font-weight="700" fill="#186547">Completed</text><text x="1360.0" y="279.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">a pass reaches the end</text><text x="1360.0" y="296.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">with every step served</text><text x="1360.0" y="314.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">from the log - result final</text><circle cx="72" cy="214" r="13" fill="#ffffff" stroke="#2aa5b0" stroke-width="1.8"/><text x="72" y="218.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2aa5b0">1</text><circle cx="680" cy="214" r="13" fill="#ffffff" stroke="#4285f4" stroke-width="1.8"/><text x="680" y="218.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4285f4">2</text><circle cx="680" cy="409" r="13" fill="#ffffff" stroke="#e0a13a" stroke-width="1.8"/><text x="680" y="413.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e0a13a">3</text><circle cx="72" cy="409" r="13" fill="#ffffff" stroke="#e05561" stroke-width="1.8"/><text x="72" y="413.6" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e05561">4</text><rect x="205.144" y="166.0" width="199.712" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="305" y="182.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">start: Engine.run() = resume()</text><path d="M520,275 L700,275" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="578.4" y="263.0" width="63.199999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="610.0" y="279.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">re-run</text><path d="M915,350 L915,395" stroke="#e0a13a" stroke-width="2.0" fill="none" marker-end="url(#ah-amber)"/><rect x="879.224" y="360.5" width="71.55199999999999" height="24.0" rx="12" fill="#ffffff" stroke="#e0a13a" stroke-opacity="0.4"/><text x="915.0" y="376.94" text-anchor="middle" font-size="12" font-weight="600" fill="#8c5a0d">new step</text><path d="M700,470 L520,470" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="578.4" y="458.0" width="63.199999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="610.0" y="474.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">record</text><path d="M305,395 L305,350" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="271.312" y="360.5" width="67.376" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="305.0" y="376.94" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">_Replay</text><path d="M1130,275 L1230,275" stroke="#2f9e6e" stroke-width="2.0" fill="none" marker-end="url(#ah-green)"/><rect x="1146.312" y="263.0" width="67.376" height="24.0" rx="12" fill="#ffffff" stroke="#2f9e6e" stroke-opacity="0.4"/><text x="1180.0" y="279.44" text-anchor="middle" font-size="12" font-weight="600" fill="#186547">returns</text><rect x="50" y="630" width="1460" height="180" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="68" y="621" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">WHAT KEEPS REPLAY HONEST</text><rect x="74" y="664" width="336" height="120" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(90,679) scale(0.8750)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 9v5"/><path d="M12 17.2v.1"/></g><text x="120" y="695" font-size="16.5" font-weight="700" fill="#9e2b36">Non-determinism caught</text><text x="91" y="717.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">assert step_id matches the id</text><text x="91" y="734.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">history recorded at this slot.</text><text x="91" y="752.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">A changed shape is rejected.</text><rect x="432" y="664" width="336" height="120" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(448,679) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V6z"/></g><text x="478" y="695" font-size="16.5" font-weight="700" fill="#186547">No double side effects</text><text x="449" y="717.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the event is persisted before</text><text x="449" y="734.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the next step is attempted, so</text><text x="449" y="752.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">resume never re-charges.</text><rect x="790" y="664" width="336" height="120" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(806,679) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 6-6h8"/><path d="M15 1l3 3-3 3"/><path d="M20 14a6 6 0 0 1-6 6H6"/><path d="M9 23l-3-3 3-3"/></g><text x="836" y="695" font-size="16.5" font-weight="700" fill="#17509f">One code path</text><text x="807" y="717.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">resume() == run(): load, run,</text><text x="807" y="734.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">replay to the first unfinished</text><text x="807" y="752.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">step. No special recovery.</text><rect x="1148" y="664" width="336" height="120" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1164,679) scale(0.8750)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g><text x="1194" y="695" font-size="16.5" font-weight="700" fill="#3d4a63">Scope</text><text x="1165" y="717.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">single-process core, not a</text><text x="1165" y="734.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">distributed task queue.</text><text x="1165" y="752.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">timers: a hashed timing wheel.</text><text x="780.0" y="862" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/durable-execution</text></svg>